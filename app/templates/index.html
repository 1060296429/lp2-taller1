{% extends "base.html" %}

{% block titulo %}Catálogo-{% endblock %}
{% block contenido %}
<h2>Catálogo de productos</h2>
<div class="catalogo">

    "{% for producto in productos %}"
    <div>
        <div class="tarjeta-producto">
            <img src="{{ url_for('static', filename=producto.foto) }}" alt="{{ producto.nombre }}">
            <h3>{{ producto.nombre }}</h3>
            <p>{{ producto.marca }}</p>
            <p>${{ "{:,.0f}".format(producto.precio) }}</p>
            <a href="{{ url_for('main.detalle', sku=producto.sku) }}">Ver detalle</a>
        </div>
       "{% endfor %}" #
    </div>
{% endblock %}
